<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazing Shopping | Immersive Luxury Experience</title>
    <!-- Open Graph / SEO -->
    <meta property="og:title" content="Amazing Shopping | Immersive Luxury Experience" />
    <meta property="og:description" content="Shop the finest selection of products with up to 80% discount, free delivery, and secure purchase." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Amazing Shopping | Immersive Luxury Experience" />
    <meta name="twitter:description" content="Shop the finest selection of products with up to 80% discount." />
    <link rel="icon" type="image/png" href="/src/assets/images/luxury_shopping_loader_1784542403271.jpg" />
    <!-- Tailwind and styles -->
    <link rel="stylesheet" href="./style.css" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#fdfdfd] text-[#1a1a1a] font-sans min-h-screen flex flex-col antialiased selection:bg-orange-100 selection:text-orange-900 overflow-x-hidden">
    <!-- LOADING / SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 bg-[#09090b] z-50 flex flex-col items-center justify-center transition-all duration-700 ease-out">
      <div class="relative w-full max-w-4xl px-4 aspect-video overflow-hidden rounded-[2rem] shadow-2xl border border-neutral-800/40 animate-splash-zoom">
        <img 
           src="/src/assets/images/luxury_shopping_loader_1784542403271.jpg" 
           alt="Amazing Shopping Loading..." 
           referrerpolicy="no-referrer"
          class="w-full h-full object-cover rounded-[2rem] scale-100 transition-transform duration-[2000ms] ease-out hover:scale-105" 
        />
        <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/30 to-transparent flex flex-col justify-end p-8 text-center md:text-left">
          <h1 class="text-3xl md:text-5xl font-black text-white tracking-tighter uppercase italic mb-2 drop-shadow-lg">
            Amazing <span class="text-orange-500">Shopping</span>
          </h1>
          <p class="text-orange-500 font-extrabold text-sm md:text-lg tracking-wider uppercase font-space">
            Luxury Redefined • Experience the Best
          </p>
        </div>
      </div>
      <!-- Immersive Orange Spinner -->
      <div class="mt-8 flex flex-col items-center gap-3">
        <div class="w-10 h-10 border-2 border-orange-500/20 border-t-orange-500 rounded-full animate-spin"></div>
        <p class="text-neutral-400 text-xs tracking-widest uppercase animate-pulse font-space font-bold">Initializing Boutique...</p>
      </div>
    </div>
    
    <!-- MAIN APP CONTENT -->
    <div id="app-content" class="hidden opacity-0 flex-1 flex flex-col transition-opacity duration-500">
      <!-- Content here... -->
    </div>

    <!-- MAIN SCRIPT -->
    <script type="module" src="./script.js"></script>
  </body>
  </html>
