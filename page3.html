                      {renderStars(product.rating)}

                        <span className="text-2xl font-display font-black text-[#FF4D00]">${product.offerPrice}</span>
                        <span className="text-xs text-slate-500 line-through font-bold">${product.price}</span>
                      </div>
                      <div className="mt-auto pt-3 flex flex-col gap-2">
                        <a href={product.affiliateLink || AFFILIATE_PROMO_URL} target="_blank" rel="noopener noreferrer" className="w-full bg-[#FF4D00] hover:bg-[#e04000] text-white font-black text-xs uppercase py-3 rounded-xl shadow-md text-center border-2 border-black">
                          🛍️ Buy Now
                        </a>
                        {product.videoLink && (
                          <a href={product.videoLink} target="_blank" rel="noopener noreferrer" className="w-full border-2 border-black hover:bg-rose-50 text-slate-800 font-black text-[11px] py-1.5 rounded-lg text-center bg-white shadow-[2px_2px_0px_#000]">
                            ▶ Product Preview Short
                          </a>
                        )}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {}
            <div className="bg-white rounded-3xl border-4 border-black shadow-[6px_6px_0px_#000] p-6">
              <div className="flex items-center justify-between mb-4 pb-3 border-b-2 border-slate-200">
                <h3 className="text-xl font-display font-black text-[#FF4D00] uppercase italic">▶ Featured YouTube Product Review</h3>
                <span className="text-xs bg-[#FFF9E6] px-3 py-1 rounded-full border-2 border-black font-bold">Watch & Learn</span>
              </div>
              <div className="w-full aspect-video md:aspect-[21/9] max-h-[400px] rounded-2xl overflow-hidden border-3 border-black bg-slate-900">
                <iframe 
                  className="w-full h-full"
                  src="https://www.youtube.com/embed/Li0XbrC0vuk" 
                  title="YouTube video player" 
                  frameBorder="0" 
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                  allowFullScreen>
                </iframe>
              </div>
            </div>

            {}
            <div className="w-full flex justify-center">
              <a href={APP_DOWNLOAD_URL} target="_blank" rel="noopener noreferrer" className="w-full max-w-2xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white p-5 rounded-3xl shadow-xl border-4 border-black shadow-[6px_6px_0px_#000] text-center flex flex-col md:flex-row items-center justify-between gap-4">
                <div className="flex items-center gap-3.5 text-left">
                  <div className="bg-white/10 p-3 rounded-xl border border-white/20 text-2xl">📱</div>
                  <div>
                    <h4 className="font-display font-black uppercase text-base text-white">Download Amazing Shopping App Free</h4>
                    <p className="text-xs text-blue-100 font-medium">Unlock VIP app-only alerts and quicker delivery support</p>
                  </div>
                </div>
                <span className="bg-white text-blue-700 font-black px-6 py-3 rounded-xl text-xs uppercase tracking-widest border-2 border-black shadow-lg">Install App</span>
              </a>
            </div>

            {}
            <div className="bg-white py-6 px-4 rounded-3xl border-4 border-black text-center flex flex-col items-center gap-4 shadow-[4px_4px_0px_#000]">
              <h5 className="font-display font-black text-slate-800 text-xs uppercase tracking-widest">Connect with our support and news channels</h5>
              <div className="flex items-center gap-6">
                <a href={FB_URL} target="_blank" rel="noopener noreferrer" className="bg-[#FFF9E6] border-2 border-black hover:bg-blue-600 text-[#FF4D00] hover:text-white p-3.5 rounded-full shadow-[2px_2px_0px_#000] font-bold">📘 Facebook</a>
                <a href={TIKTOK_URL} target="_blank" rel="noopener noreferrer" className="bg-[#FFF9E6] border-2 border-black hover:bg-slate-950 text-slate-900 hover:text-white p-3.5 rounded-full shadow-[2px_2px_0px_#000] font-bold">🎵 TikTok</a>
                <a href={YT_URL} target="_blank" rel="noopener noreferrer" className="bg-[#FFF9E6] border-2 border-black hover:bg-rose-600 text-rose-600 hover:text-white p-3.5 rounded-full shadow-[2px_2px_0px_#000] font-bold">▶ YouTube</a>
              </div>
            </div>

          </main>

          {}
          <footer className="bg-white border-t-4 border-black mt-12 py-6 px-6 text-xs font-semibold text-slate-600">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
              <div className="flex items-center gap-2">
                <span className="font-display font-black text-xl italic text-[#FF4D00]">AMAZING SHOPPING</span>
              </div>
              <div className="text-center md:text-right flex flex-col gap-1 text-slate-500">
                <p>© 2026 Amazing Shopping — Premium Affiliate Network</p>
                <p>Need Delivery Support? Contact WhatsApp: <a href="https://wa.me/01764335343" className="text-[#FF4D00] font-black underline">01764335343</a></p>
              </div>
            </div>
          </footer>

          {}
          <div className="fixed bottom-6 right-6 z-40 flex flex-col items-end">
            {isChatOpen && (
              <div className="bg-white w-[340px] md:w-[380px] h-[490px] rounded-3xl shadow-[8px_8px_0px_#000] border-4 border-black flex flex-col overflow-hidden mb-4">
                <div className="bg-[#FF4D00] p-4 text-white flex items-center justify-between border-b-4 border-black">
                  <div className="flex items-center gap-2">
                    <span className="text-lg">🤖</span>
                    <div>
                      <h4 className="font-display font-black text-sm uppercase">Amazing Chatbot</h4>
                      <div className="flex items-center gap-1">
                        <span className="h-2 w-2 rounded-full bg-emerald-400"></span>
                        <span className="text-[10px] text-yellow-200 font-bold uppercase">Online Support Agent</span>
                      </div>
                    </div>
                  </div>
                  <button onClick={() => setIsChatOpen(false)} className="text-white hover:bg-white/20 p-1.5 rounded-xl font-bold">✕</button>
                </div>
                
                <div className="bg-[#FFF9E6] border-b-2 border-black px-4 py-2 text-slate-800 text-xs font-bold">
                  💬 WhatsApp Support: <a href="https://wa.me/01764335343" className="text-[#FF4D00] underline">01764335343</a>
                </div>

                <div className="flex-1 p-4 overflow-y-auto bg-slate-50 flex flex-col gap-3">
                  {chatMessages.map((msg) => (
                    <div key={msg.id} className={`flex flex-col max-w-[85%] ${msg.sender === "user" ? "ml-auto items-end" : "mr-auto items-start"}`}>
                      <div className={`px-3.5 py-2.5 rounded-2xl text-xs font-semibold shadow-[2px_2px_0px_#000] border-2 border-black ${msg.sender === "user" ? "bg-[#2979FF] text-white" : "bg-white text-slate-800"}`}>
                        {msg.text}
                      </div>
                      <span className="text-[9px] text-slate-500 mt-1 font-mono">{msg.timestamp}</span>
                    </div>
                  ))}
                  {isTyping && (
                    <div className="bg-white text-slate-500 px-3 py-2 rounded-xl border-2 border-black text-xs font-bold animate-pulse">Typing reply...</div>
                  )}
                  <div ref={chatEndRef} />
                </div>

                <form onSubmit={handleSendMessage} className="p-3 bg-white border-t-2 border-black flex gap-2">
                  <input
                    type="text"
                    placeholder="Type a message or delivery question..."
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    className="flex-1 px-4 py-2.5 text-xs rounded-xl border-2 border-black bg-slate-50 font-semibold focus:outline-none"
                  />
                  <button type="submit" className="bg-[#FF4D00] text-white px-4 py-2.5 rounded-xl shadow-[2px_2px_0px_#000] border-2 border-black font-black text-xs uppercase">Send</button>
                </form>
              </div>
            )}

            <button
              onClick={() => setIsChatOpen(!isChatOpen)}
              className="bg-[#FFB300] text-slate-950 p-4 rounded-full shadow-[4px_4px_0px_#000] hover:scale-105 transition-all relative z-50 flex items-center justify-center border-3 border-black animate-bounce font-bold text-xl"
            >
              💬
            </button>
          </div>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
  </html>
