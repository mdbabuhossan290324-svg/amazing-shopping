<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazing Shopping - Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen p-4 md:p-8">

  <div class="max-w-3xl mx-auto space-y-8">
    <div class="text-center space-y-2">
      <h1 class="text-3xl font-bold font-display tracking-tight text-slate-900">⚙️ Amazing Admin Panel</h1>
      <p class="text-slate-500 text-xs font-semibold">The control room to manage your online store and product listings</p>
      <a href="index.html" class="inline-block text-xs font-bold text-rose-500 hover:underline">← Back to Store</a>
    </div>

    <!-- Password Verification Block -->
    <div id="login-card" class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm max-w-md mx-auto space-y-4">
      <h3 class="text-xs font-bold uppercase text-slate-400 tracking-wider font-mono">Admin Access Required</h3>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Admin Password</label>
          <input id="password-input" type="password" placeholder="Enter password (e.g. admin123)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" />
          <p class="text-[10px] text-slate-400 mt-1">For safety, use the default password **admin123**</p>
        </div>
        <button onclick="verifyPassword()" class="w-full bg-rose-500 text-white font-bold py-2 rounded-xl text-xs hover:bg-rose-600 shadow-md">Verify & Login</button>
      </div>
    </div>

    <!-- Admin Content Panel (Hidden by default) -->
    <div id="admin-panel" class="hidden space-y-8">
      
      <!-- Product Form -->
      <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm space-y-6">
        <h3 class="font-extrabold text-slate-800 text-base md:text-lg border-b border-slate-100 pb-3 flex items-center space-x-2">
          <span>Upload New Product Form</span>
        </h3>

        <form id="product-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Product Name *</label>
            <input id="prod-name" type="text" placeholder="e.g. Wireless Earbuds Pro" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" required />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Regular Price (USD $) *</label>
            <input id="prod-price" type="number" placeholder="e.g. 2500" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" required />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Offer Price (USD $) *</label>
            <input id="prod-offer" type="number" placeholder="e.g. 1299" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" required />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Rating Value (e.g. 4.8) *</label>
            <input id="prod-rating" type="text" value="4.8" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" required />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Total Ratings (e.g. 128) *</label>
            <input id="prod-rating-count" type="text" value="128" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" required />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Sold Count String (e.g. 1.2k sold) *</label>
            <input id="prod-sold" type="text" value="1.2k sold" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" required />
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-bold text-slate-700 mb-1">Product Image Link (Photo URL) *</label>
            <input id="prod-photo" type="url" placeholder="https://example.com/photo.jpg" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" required />
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-bold text-slate-700 mb-1">Affiliate/Product Link *</label>
            <input id="prod-affiliate" type="url" placeholder="https://www.effectivecpmnetwork.com/jjgii2iixj?key=..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" required />
          </div>
          <div class="flex items-center space-x-2 py-2">
            <input type="checkbox" id="prod-free-delivery" class="w-4 h-4 rounded text-rose-500 focus:ring-rose-500 border-slate-300" checked />
            <label for="prod-free-delivery" class="text-xs font-bold text-slate-700">Is Free Delivery applicable for this product?</label>
          </div>
          <div class="md:col-span-2 pt-2">
            <button type="submit" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 rounded-xl text-xs md:text-sm uppercase tracking-wider shadow-md transition-all">
              Post New Product
            </button>
          </div>
        </form>
      </div>

      <!-- Video Update Form -->
      <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm space-y-4">
        <h3 class="font-extrabold text-slate-800 text-base md:text-lg border-b border-slate-100 pb-3">Change Featured YouTube Video</h3>
        <form id="video-form" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Featured YouTube Video Link (Shorts or Regular)</label>
            <input id="video-url" type="url" placeholder="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none" required />
          </div>
          <button type="submit" class="bg-slate-900 text-white px-6 py-2.5 rounded-xl text-xs font-bold uppercase hover:bg-slate-950 shadow-md">Update Featured Video</button>
        </form>
      </div>

      <!-- Action status messages -->
      <div id="status-box" class="hidden p-4 rounded-xl text-xs border"></div>

      <!-- Active Products list -->
      <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm space-y-4">
        <h3 class="font-extrabold text-slate-800 text-base border-b border-slate-100 pb-2">Currently Active Products (<span id="products-count">0</span>)</h3>
        <div id="active-products" class="divide-y divide-slate-100">
          <!-- Active products injected here -->
        </div>
      </div>

    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCEwO6gl1sWEx4_tra-3KpBp6hcHGQE_3I",
      authDomain: "amazing-shopping-2d3bc.firebaseapp.com",
      projectId: "amazing-shopping-2d3bc",
      storageBucket: "amazing-shopping-2d3bc.firebasestorage.app",
      messagingSenderId: "163413077176",
      appId: "1:163413077176:web:b82c2976b0193fe740984d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function showStatus(text, type = "success") {
      const box = document.getElementById("status-box");
      box.className = `p-4 rounded-xl text-xs border ${
        type === "success" 
          ? "bg-emerald-50 border-emerald-200 text-emerald-800" 
          : "bg-rose-50 border-rose-200 text-rose-800"
      }`;
      box.innerText = text;
      box.classList.remove("hidden");
      setTimeout(() => box.classList.add("hidden"), 4000);
    }

    function verifyPassword() {
      const p = document.getElementById("password-input").value;
      if (p === "admin123" || p === "admin") {
        document.getElementById("login-card").classList.add("hidden");
        document.getElementById("admin-panel").classList.remove("hidden");
        loadAdminData();
      } else {
        alert("Incorrect password!");
      }
    }

    async function loadAdminData() {
      try {
        const snapshot = await db.collection("products").orderBy("createdAt", "desc").get();
        const container = document.getElementById("active-products");
        const countSpan = document.getElementById("products-count");
        
        countSpan.innerText = snapshot.size;
        container.innerHTML = "";

        if (snapshot.empty) {
          container.innerHTML = `<p class="text-slate-400 text-xs py-4 text-center">No products have been uploaded yet.</p>`;
        } else {
          snapshot.forEach((doc) => {
            const p = doc.data();
            container.innerHTML += `
              <div class="py-3 flex items-center justify-between">
                <div class="flex items-center space-x-3 overflow-hidden">
                  <img src="${p.photoLink}" class="w-10 h-10 object-cover rounded-lg" />
                  <div>
                    <p class="text-xs font-bold text-slate-800 truncate">${p.name}</p>
                    <p class="text-[10px] text-rose-500 font-bold">$${p.offerPrice} <span class="text-slate-400 line-through">$${p.price}</span></p>
                  </div>
                </div>
                <button onclick="deleteProduct('${doc.id}')" class="text-rose-500 hover:bg-rose-50 hover:text-rose-700 px-3 py-1 rounded text-xs font-bold">Delete</button>
              </div>
            `;
          });
        }

        // load video link
        const videoDoc = await db.collection("config").doc("video").get();
        if (videoDoc.exists) {
          document.getElementById("video-url").value = videoDoc.data().videoLink || "";
        }
      } catch (err) {
        console.error("Error loading products:", err);
      }
    }

    // Submit Product Handler
    document.getElementById("product-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("prod-name").value;
      const price = document.getElementById("prod-price").value;
      const offerPrice = document.getElementById("prod-offer").value;
      const rating = document.getElementById("prod-rating").value;
      const ratingCount = document.getElementById("prod-rating-count").value;
      const soldCount = document.getElementById("prod-sold").value;
      const photoLink = document.getElementById("prod-photo").value;
      const affiliateLink = document.getElementById("prod-affiliate").value;
      const freeDelivery = document.getElementById("prod-free-delivery").checked;

      try {
        await db.collection("products").add({
          name, price, offerPrice, rating, ratingCount, soldCount, photoLink, affiliateLink, freeDelivery,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        showStatus("Product has been posted successfully!");
        document.getElementById("product-form").reset();
        loadAdminData();
      } catch (err) {
        showStatus("Error: " + err.message, "error");
      }
    });

    // Update Video Handler
    document.getElementById("video-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const videoLink = document.getElementById("video-url").value;

      try {
        await db.collection("config").doc("video").set({ videoLink }, { merge: true });
        showStatus("Featured video link has been updated successfully!");
        loadAdminData();
      } catch (err) {
        showStatus("Error: " + err.message, "error");
      }
    });

    // Delete Product
    async function deleteProduct(id) {
      if (!confirm("Are you sure you want to delete this product?")) return;
      try {
        await db.collection("products").doc(id).delete();
        showStatus("Product has been deleted successfully!");
        loadAdminData();
      } catch (err) {
        showStatus("Error: " + err.message, "error");
      }
    }
  </script>
</body>
  </html>
